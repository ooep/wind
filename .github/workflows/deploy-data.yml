name: deploy · 数据组装发布

# 数据 workflow(任一)成功完成后:拉取全部四个模式的最新数据 artifact,
# 组装 dist/data 并发布到 Cloudflare Pages。数据不再提交 main,避免仓库膨胀。
on:
  workflow_run:
    workflows:
      - 'data · GFS 0.5°'
      - 'data · GEFS 0.5°'
      - 'data · ECMWF IFS 0.25°'
      - 'data · ECMWF AIFS 0.25°'
      - 'data · GFS Wave 0.25°'
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 拉取各模式最新数据产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/fetch-data-artifacts.sh

      - name: 组装 _site(前端 + dist/data)
        run: bash pages-build.sh

      - name: 发布到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy _site --project-name=fengyun
