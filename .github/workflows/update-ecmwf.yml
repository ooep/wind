name: data · ECMWF IFS 0.25°

# 独立数据源管道:定时抓取原始 GRIB2 → 自解码 → 生成静态数据包 → 发布到 data-dist 分支。
# 与其他数据源的 Action 相互独立,互不阻塞。
on:
  schedule:
    - cron: '30 8,14,20,2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: data-ecmwf_raw
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # eccodes(轮子内置二进制):ECMWF 新输出的 5.42 CCSDS 打包由 server/ecc.py 兜底解码
      - name: 安装 eccodes
        run: pip install --quiet eccodes

      # 跨轮恢复摄取进度:限流期的抓取逐轮累积
      - name: 恢复摄取缓存
        uses: actions/cache@v4
        with:
          path: .cache/nwp-ecmwf_raw
          key: ingest-ecmwf_raw-latest
          restore-keys: ingest-ecmwf_raw-

      - name: 生成静态数据包
        run: |
          node tools/build-static.js --out out/data --models ecmwf_raw

      - name: 保存摄取缓存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/nwp-ecmwf_raw
          key: ingest-ecmwf_raw-latest-${{ github.run_id }}

      - name: 上传数据产物(deploy-data 工作流统一组装部署,数据不再提交 main)
        uses: actions/upload-artifact@v4
        with:
          name: data-ecmwf_raw
          path: out/data/
          retention-days: 3
          if-no-files-found: error
