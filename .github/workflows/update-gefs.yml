name: data · GEFS 0.5°

# 独立数据源管道:定时抓取原始 GRIB2 → 自解码 → 生成静态数据包 → 发布到 data-dist 分支。
# 与其他数据源的 Action 相互独立,互不阻塞。
on:
  schedule:
    - cron: '40 4,10,16,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: data-gefs_raw
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 跨轮恢复摄取进度:限流期的抓取逐轮累积
      - name: 恢复摄取缓存
        uses: actions/cache@v4
        with:
          path: .cache/nwp-gefs
          key: ingest-gefs_raw-latest
          restore-keys: ingest-gefs_raw-

      - name: 生成静态数据包
        run: |
          node tools/build-static.js --out out/data --models gefs_raw

      - name: 保存摄取缓存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/nwp-gefs
          key: ingest-gefs_raw-latest-${{ github.run_id }}

      - name: 上传数据产物(deploy-data 工作流统一组装部署,数据不再提交 main)
        uses: actions/upload-artifact@v4
        with:
          name: data-gefs_raw
          path: out/data/
          retention-days: 3
          if-no-files-found: error
