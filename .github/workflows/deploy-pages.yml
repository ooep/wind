name: deploy · Cloudflare Pages

# main 有前端更新即自动组装 _site 并发布到 Cloudflare Pages(免费版)。
# 数据已不走 main 提交:部署前统一拉取各模式最新的数据 artifact,保证数据不回退。
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'dist/data/**'
      - 'pages-build.sh'
      - 'tools/fetch-data-artifacts.sh'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 拉取各模式最新数据产物
        run: bash tools/fetch-data-artifacts.sh

      - name: 组装 _site(前端 + dist/data)
        run: bash pages-build.sh

      - name: 发布到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy _site --project-name=fengyun
