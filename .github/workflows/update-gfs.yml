name: data · GFS 0.5°

# 独立数据源管道:定时抓取原始 GRIB2 → 自解码 → 生成静态数据包 → 发布到 data-dist 分支。
# 与其他数据源的 Action 相互独立,互不阻塞。
on:
  schedule:
    - cron: '30 4,10,16,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: data-gfs_raw
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # 层级包+X 变量后约 3200 条;并发组排队后仍需 ~90 分钟,留足余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 跨轮恢复摄取进度:限流期的抓取逐轮累积(含 9 个气压层引擎目录)
      - name: 恢复摄取缓存
        uses: actions/cache@v4
        with:
          path: |
            .cache/gfsraw
            .cache/gfsraw-x
            .cache/gfsraw-l925
            .cache/gfsraw-l850
            .cache/gfsraw-l700
            .cache/gfsraw-l500
            .cache/gfsraw-l300
            .cache/gfsraw-l250
            .cache/gfsraw-l200
            .cache/gfsraw-l150
            .cache/gfsraw-l100
            .cache/gfsraw-l70
            .cache/gfsraw-l10
          key: ingest-gfs_raw-latest
          restore-keys: ingest-gfs_raw-

      - name: 生成静态数据包
        run: |
          node tools/build-static.js --out out/data --models gfs_raw,gfs_snow

      - name: 保存摄取缓存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .cache/gfsraw
            .cache/gfsraw-x
            .cache/gfsraw-l925
            .cache/gfsraw-l850
            .cache/gfsraw-l700
            .cache/gfsraw-l500
            .cache/gfsraw-l300
            .cache/gfsraw-l250
            .cache/gfsraw-l200
            .cache/gfsraw-l150
            .cache/gfsraw-l100
            .cache/gfsraw-l70
            .cache/gfsraw-l10
          key: ingest-gfs_raw-latest-${{ github.run_id }}

      - name: 上传数据产物(deploy-data 工作流统一组装部署,数据不再提交 main)
        uses: actions/upload-artifact@v4
        with:
          name: data-gfs_raw
          path: out/data/gfs_raw/
          retention-days: 3
          if-no-files-found: error

      - name: 上传高分辨雪包产物
        uses: actions/upload-artifact@v4
        with:
          name: data-gfs_snow
          path: out/data/gfs_snow/
          retention-days: 3
          if-no-files-found: error
