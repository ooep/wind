name: data · GFS 0.5°

# 独立数据源管道:定时抓取原始 GRIB2 → 自解码 → 生成静态数据包 → 发布到 data-dist 分支。
# 与其他数据源的 Action 相互独立,互不阻塞。
on:
  schedule:
    - cron: '30 4,10,16,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-gfs_raw
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 跨轮恢复摄取进度:限流期的抓取逐轮累积
      - name: 恢复摄取缓存
        uses: actions/cache@v4
        with:
          path: .cache/gfsraw
          key: ingest-gfs_raw-latest
          restore-keys: ingest-gfs_raw-

      - name: 生成静态数据包
        run: |
          node tools/build-static.js --out out/data --models gfs_raw

      - name: 保存摄取缓存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/gfsraw
          key: ingest-gfs_raw-latest-${{ github.run_id }}

      - name: 发布数据到仓库(触发 Cloudflare Pages 自动部署)
        run: |
          git config user.name  "fy-data-bot"
          git config user.email "fy-data-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          rm -rf dist/data/gfs_raw
          mkdir -p dist/data
          cp -r out/data/. dist/data/
          # 只保留各模式最新一轮 run,防止仓库膨胀
          find dist/data -mindepth 2 -maxdepth 2 -type d -name '20*' -mtime +2 -exec rm -rf {} + 2>/dev/null || true
          node tools/build-static.js --out dist/data --index-only
          git add -A -f dist/data
          git commit -m "data update $(date -u '+%Y-%m-%dT%H:%MZ')" || echo "无变更"
          for i in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            sleep 20
            git pull --rebase origin main || true
          done
