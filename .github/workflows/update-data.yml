name: update-weather-data

# 定时抓取 NOAA/ECMWF 原始 GRIB2 → 解码 → 生成静态数据包 → 推送到数据分支
# 四个模型并行摄取(矩阵),互不拖累;Actions 缓存让 ECMWF 限流期的抓取进度跨轮累积。
on:
  schedule:
    # NOAA/ECMWF 00/06/12/18Z 时次发布后约 +3.5~7h 完成上传,加缓冲
    - cron: '30 4,10,16,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-weather-data
  cancel-in-progress: false

jobs:
  ingest:
    name: 摄取 ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      matrix:
        model: [gfs_raw, gefs_raw, ecmwf_raw, aifs_raw]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 跨轮恢复摄取进度(.done/.bin):ECMWF 限流期的抓取逐轮累积
      - name: 恢复摄取缓存
        uses: actions/cache@v4
        with:
          path: .cache/${{ matrix.model == 'gfs_raw' && 'gfsraw' || format('nwp-{0}', matrix.model) }}
          key: ingest-${{ matrix.model }}-${{ github.run_id }}
          restore-keys: ingest-${{ matrix.model }}-

      - name: 生成静态数据包
        run: |
          node tools/build-static.js \
            --out "out/${{ matrix.model }}" \
            --models "${{ matrix.model }}"

      - name: 保存摄取缓存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/${{ matrix.model == 'gfs_raw' && 'gfsraw' || format('nwp-{0}', matrix.model) }}
          key: ingest-${{ matrix.model }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.model }}
          path: out/${{ matrix.model }}
          retention-days: 3

  publish:
    name: 汇总发布
    needs: ingest
    if: always() && !cancelled() && needs.ingest.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 下载各模式数据包
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 合并并重建索引
        run: |
          mkdir -p dist/data
          for d in artifacts/data-*/; do
            [ -d "$d" ] || continue
            cp -r "$d"/* dist/data/ 2>/dev/null || true
          done
          node tools/build-static.js --out dist/data --index-only

      - name: 发布到 data-dist 分支(force,浅历史)
        run: |
          git config user.name  "fy-data-bot"
          git config user.email "fy-data-bot@users.noreply.github.com"
          git checkout --orphan data-dist
          git reset --hard
          git add dist/data
          git commit -m "data update $(date -u '+%Y-%m-%dT%H:%MZ')"
          git push -f origin data-dist
