name: data · 站点实况与热带气旋

# 观测类数据管道:全球 METAR 站点实况(aviationweather.gov)+ NHC 活动飓风 + 城市空气质量(Open-Meteo/CAMS)。
# 每小时烘焙为小体积 JSON,上传 artifact 由 deploy-data 统一组装部署(数据不提交 main)。

on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch: {}

concurrency:
  group: data-obs
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取并烘焙观测数据
        run: |
          node tools/bake-obs.js dist/data
          node tools/bake-taf.js dist/data
          node tools/bake-tropical.js dist/data
          node tools/bake-aq.js dist/data
          node tools/bake-fires.js dist/data

      - name: 上传数据 artifact(deploy-data 统一组装部署)
        uses: actions/upload-artifact@v4
        with:
          name: data-obs
          path: |
            dist/data/obs
            dist/data/tropical
            dist/data/aq
            dist/data/fires
          retention-days: 3
