name: data · ECMWF AIFS 0.25°

# 独立数据源管道:定时抓取原始 GRIB2 → 自解码 → 生成静态数据包 → 发布到 data-dist 分支。
# 与其他数据源的 Action 相互独立,互不阻塞。
on:
  schedule:
    - cron: '45 8,14,20,2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: data-aifs_raw
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 跨轮恢复摄取进度:限流期的抓取逐轮累积
      - name: 恢复摄取缓存
        uses: actions/cache@v4
        with:
          path: .cache/nwp-aifs_raw
          key: ingest-aifs_raw-latest
          restore-keys: ingest-aifs_raw-

      - name: 生成静态数据包
        run: |
          node tools/build-static.js --out out/data --models aifs_raw

      - name: 保存摄取缓存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/nwp-aifs_raw
          key: ingest-aifs_raw-latest-${{ github.run_id }}

      - name: 发布数据到仓库(触发 Cloudflare Pages 自动部署)
        run: |
          git config user.name  "fy-data-bot"
          git config user.email "fy-data-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          rm -rf dist/data/aifs_raw
          mkdir -p dist/data
          cp -r out/data/. dist/data/
          # 只保留各模式最新一轮 run,防止仓库膨胀
          find dist/data -mindepth 2 -maxdepth 2 -type d -name '20*' -mtime +2 -exec rm -rf {} + 2>/dev/null || true
          node tools/build-static.js --out dist/data --index-only
          git add -A -f dist/data
          if git diff --cached --quiet; then echo "数据无变更,跳过发布"; exit 0; fi
          git commit -m "data update $(date -u '+%Y-%m-%dT%H:%MZ')"
          for i in 1 2 3 4 5; do
            if git push origin main; then
              # GITHUB_TOKEN 的 push 事件不会触发其他 workflow,显式触发静态部署
              gh workflow run deploy-pages.yml --ref main
              exit 0
            fi
            sleep 20
            git pull --rebase origin main || true
          done
          git push origin main && gh workflow run deploy-pages.yml --ref main
