<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>风云地球 FengyunEarth · 实时全球气象可视化</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%230b1420'/><path d='M18 42c14-6 26 6 40 0s18-10 24-4M18 58c14-6 26 6 40 0s18-10 24-4' stroke='%2345c4ff' stroke-width='7' fill='none' stroke-linecap='round'/></svg>">
</head>
<body>
<div id="map"></div>
<div id="overlay-root"></div>

<!-- 顶栏:品牌 + 搜索 -->
<header id="topbar">
  <div id="brand">
    <svg viewBox="0 0 100 100" width="26" height="26" aria-hidden="true">
      <circle cx="50" cy="50" r="44" fill="rgba(69,196,255,.12)"/>
      <path d="M18 42c14-6 26 6 40 0s18-10 24-4M18 58c14-6 26 6 40 0s18-10 24-4" stroke="#45c4ff" stroke-width="8" fill="none" stroke-linecap="round"/>
    </svg>
    <div><b>风云地球</b><span>FENGYUN EARTH</span></div>
  </div>
  <div id="searchbox">
    <svg viewBox="0 0 24 24" width="15" height="15"><path d="M10.5 3a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15zm10 18-4.8-4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="search-input" type="text" data-i18n-ph="ui.searchPh" autocomplete="off" spellcheck="false">
    <div id="search-results" hidden></div>
  </div>
  <button id="loc-btn" data-i18n-title="ui.myLoc">
    <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 2.5a1.4 1.4 0 0 1 1.4 1.4v1.2a7 7 0 0 1 5.5 5.5h1.2a1.4 1.4 0 1 1 0 2.8h-1.2a7 7 0 0 1-5.5 5.5v1.2a1.4 1.4 0 1 1-2.8 0v-1.2a7 7 0 0 1-5.5-5.5H4.1a1.4 1.4 0 1 1 0-2.8h1.2a7 7 0 0 1 5.5-5.5V3.9A1.4 1.4 0 0 1 12 2.5z" fill="currentColor"/><circle cx="12" cy="12" r="3.2" fill="#0b1420"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
  </button>
  <button id="fav-btn" data-i18n-title="ui.favBtn">
    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3.6l2.5 5.2 5.7.7-4.2 3.9 1.1 5.6-5.1-2.8-5.1 2.8 1.1-5.6L3.8 9.5l5.7-.7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
  </button>
  <div id="fav-list" hidden></div>
</header>

<!-- 左侧图层栏 -->
<nav id="layerbar">
  <button id="toggle-particles" class="particle-toggle active" data-i18n-title="ui.particlesTitle">
    <svg viewBox="0 0 24 24" width="17" height="17"><path d="M3 8c4-2.5 7 2.5 11 0M3 13c4-2.5 7 2.5 11 0M7 18c3-2 5 2 9 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span data-i18n="ui.particles">风场粒子</span><i class="dot"></i>
  </button>
  <div class="sep"></div>
  <div id="layer-buttons"></div>
  <div class="sep"></div>
  <div id="overlay-label" data-i18n="ui.overlayHead">实时叠加</div>
  <div id="overlay-buttons"></div>
  <div id="sat-channel-wrap" hidden>
    <select id="sat-channel" data-i18n-title="ui.satTitle">
      <option value="auto" data-i18n="satCh.auto">自动 · 按视野</option>
      <option value="irh" data-i18n="satCh.irh">红外 · 向日葵9(亚洲/大洋洲)</option>
      <option value="irw" data-i18n="satCh.irw">红外 · GOES-West(太平洋)</option>
      <option value="ire" data-i18n="satCh.ire">红外 · GOES-East(美洲/大西洋)</option>
      <option value="geow" data-i18n="satCh.geow">真彩 · GOES-West(昼夜融合)</option>
      <option value="geoe" data-i18n="satCh.geoe">真彩 · GOES-East(昼夜融合)</option>
      <option value="truecolor" data-i18n="satCh.truecolor">真彩 · 全球(VIIRS 每日)</option>
      <option value="night" data-i18n="satCh.night">夜光 · 全球(VIIRS 每日)</option>
    </select>
  </div>
  <div class="sep"></div>
  <div id="levelbar" hidden></div>
  <div id="opacity-ctl" data-i18n-title="ui.opacity">
    <span data-i18n="ui.opacity">透明度</span>
    <input type="range" id="opacity-slider" min="35" max="100" step="5" value="100">
    <b id="opacity-val">100%</b>
  </div>
  <div id="legend" hidden>
    <div id="legend-title"></div>
    <div id="legend-bar"></div>
    <div id="legend-labels"></div>
  </div>
</nav>

<!-- 右上:设置 -->
<div id="settings">
  <label class="ctl" title="Language / 语言">
    <span data-i18n="lang.label">语言</span>
    <select id="lang-select"></select>
  </label>
  <label class="ctl" data-i18n-title="ui.bmTitle">
    <span data-i18n="ui.bm">底图</span>
    <select id="basemap-select">
      <option value="vector" data-i18n="ui.bmVector">矢量线划</option>
      <option value="dark" data-i18n="ui.bmDark">深色陆地</option>
      <option value="satellite" data-i18n="ui.bmSat">卫星 + 线划</option>
      <option value="terrain" data-i18n="ui.bmTerrain">地形(实验)</option>
      <option value="hillshade" data-i18n="ui.bmHillshade">地形晕渲(NASA SRTM)</option>
    </select>
  </label>
  <button id="units-btn" data-i18n-title="ui.unitsTitle">
    <svg viewBox="0 0 24 24" width="15" height="15"><path d="M3 8h18v8H3zM7 8v3M11 8v4M15 8v3M19 8v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <div id="units-pop" hidden></div>
  <button id="legend-btn" data-i18n-title="ui.legendBtnTitle">
    <svg viewBox="0 0 24 24" width="15" height="15"><rect x="3" y="10" width="18" height="4" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 6.5v1.5M12 5.5V8M17 6.5V8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <button id="globe-btn" data-i18n-title="ui.globeTitle">
    <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 12h18M12 3c2.6 2.4 4 5.6 4 9s-1.4 6.6-4 9c-2.6-2.4-4-5.6-4-9s1.4-6.6 4-9z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
  <button id="measure-btn" data-i18n-title="ui.measureTitle">
    <svg viewBox="0 0 24 24" width="15" height="15"><path d="M3 17L17 3l4 4L7 21zM8 12l2 2M11 9l2 2M14 6l2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="fs-btn" data-i18n-title="ui.fsTitle">
    <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="share-btn" data-i18n-title="ui.shareTitle">⧉</button>
  <button id="about-btn" data-i18n-title="ui.aboutTitle">ⓘ</button>
</div>
<button id="settings-toggle" data-i18n-title="ui.settings">⚙</button>

<!-- 右下:模式选择胶囊(仅当前图层有多个数据模式时显示;单模式图层点开即用,胶囊自动隐藏) -->
<div id="model-pill" data-i18n-title="ui.modelPillTitle">
  <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M19.1 4.9l-2.8 2.8M7.7 16.3l-2.8 2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  <select id="model-select">
    <optgroup data-i18n-og="ui.pipeGroup" label="自建管道">
      <option value="gfs_raw">NOAA GFS</option>
      <option value="gfs_snow">GFS 雪(0.5°)</option>
      <option value="gefs_raw">NOAA GEFS</option>
      <option value="ecmwf_raw">ECMWF IFS</option>
      <option value="aifs_raw">ECMWF AIFS(AI)</option>
      <option value="waves_raw">NOAA Wave(海浪)</option>
      <option value="ocean_raw">OISST(海温日更)</option>
      <option value="chem_raw">GEOS-5 化学(全球场)</option>
    </optgroup>
    <optgroup data-i18n-og="ui.omGroup" label="Open-Meteo 备用">
      <option value="best_match">最佳匹配</option>
      <option value="gfs_seamless">GFS</option>
      <option value="icon_seamless">ICON</option>
      <option value="ecmwf_ifs025">ECMWF</option>
    </optgroup>
  </select>
</div>

<!-- 底部时间轴 -->
<div id="timelinebar">
  <button id="play-btn" data-i18n-title="ui.playTitle">
    <svg id="icon-play" viewBox="0 0 24 24" width="16" height="16"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24" width="16" height="16" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>
  </button>
  <div id="time-display"><b id="time-main">--</b><span id="time-sub"></span></div>
  <div id="timeline">
    <div id="tl-track">
      <div id="tl-datapast" hidden></div>
      <div id="tl-datafcst" hidden></div>
      <div id="tl-ticks"></div>
      <div id="tl-now"></div>
      <div id="tl-thumb"></div>
    </div>
    <div id="tl-bubble" hidden><b id="tb-a"></b><span id="tb-b"></span></div>
  </div>
  <div id="tl-speed" data-i18n-title="ui.speedTitle">
    <button data-s="0.5">0.5×</button><button data-s="1" class="active">1×</button><button data-s="2">2×</button>
  </div>
  <div id="tl-step">
    <button id="step-back" data-i18n-title="ui.stepBackT">‹</button>
    <button id="step-fwd" data-i18n-title="ui.stepFwdT">›</button>
    <button id="step-now" data-i18n="ui.stepNow" data-i18n-title="ui.stepNowT">现在</button>
  </div>
</div>
<button id="now-fab" hidden data-i18n="ui.nowFab" data-i18n-title="ui.stepNowT">⟲ 回到当前</button>

<!-- 点位预报面板 -->
<aside id="panel" hidden>
  <div id="panel-head">
    <div id="panel-loc"><b id="panel-title" data-i18n="ui.panelTitle">位置</b><span id="panel-coords"></span></div>
    <div style="display:flex;gap:2px;align-items:center">
      <button id="panel-fav" data-i18n-title="ui.panelFav">☆</button>
      <button id="panel-close" title="✕">✕</button>
    </div>
  </div>
  <div id="panel-body">
    <div id="panel-loading" class="spinner"></div>
    <div id="panel-content" hidden></div>
  </div>
</aside>

<!-- 数据说明弹窗(正文按界面语言由 i18n 渲染) -->
<dialog id="about">
  <div class="dlg-head"><b data-i18n="about.title">数据来源与说明</b><button id="about-close">✕</button></div>
  <div class="dlg-body" id="about-body"></div>
</dialog>

<div id="toast" hidden></div>
<div id="hint" hidden></div>
<div id="grid-loading" hidden><div class="spinner"></div><span data-i18n="ui.gridLoading">正在加载气象场数据…</span></div>
<div id="cursor-tip" hidden><b id="ct-val"></b><span id="ct-sub"></span></div>

<!-- 测距量算条 -->
<div id="measure-bar" hidden>
  <span id="measure-info" data-i18n="ui.meInfo">点击地图加点</span>
  <button id="measure-done" data-i18n="ui.meDone">完成</button>
  <button id="measure-clear" data-i18n="ui.meClear">清除</button>
  <button id="measure-exit" data-i18n="ui.meExit">退出</button>
</div>

<footer id="attrib">
  <span data-i18n="ui.attribData">数据</span> <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>(GFS/ICON/ECMWF) ·
  <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a> ·
  <a href="https://worldview.earthdata.nasa.gov/" target="_blank" rel="noopener">NASA GIBS</a> ·
  <a href="https://aviationweather.gov/" target="_blank" rel="noopener">NOAA METAR/TAF</a> ·
  <a href="https://blitzortung.org/" target="_blank" rel="noopener">Blitzortung</a>(<span data-i18n="ui.attribLightning">闪电</span>) ·
  <a href="https://www.jma.go.jp/jma/indexe.html" target="_blank" rel="noopener">JMA</a>/<a href="https://www.nhc.noaa.gov/" target="_blank" rel="noopener">NHC</a>(<span data-i18n="ui.attribTC">台风</span>)
  | <span data-i18n="ui.attribBasemap">底图</span> <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>
</footer>

<script>
  /* 部署配置:纯静态模式下,把 staticData 指向静态数据仓库(如 GitHub Pages)地址。
     本地 Node 模式保持为空字符串即可。也可用 URL 参数 ?data=<数据地址> 临时指定。 */
  window.FY_CONFIG = window.FY_CONFIG || { staticData: '' };
</script>
<script>
  window.__capt = [];
  const __ce = console.error;
  const __cl = console.log;
  console.error = function(...a) { window.__capt.push('E: ' + a.map(x => (x && x.message) || String(x)).join(' ')); __ce(...a); };
  console.log = function(...a) { window.__capt.push('L: ' + a.map(x => (x && x.message) || String(x)).join(' ')); __cl(...a); };
  window.addEventListener('error', (e) => window.__capt.push('ERR ' + e.message + ':' + e.lineno));
</script>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/main.js?v=15"></script>
</body>
</html>
